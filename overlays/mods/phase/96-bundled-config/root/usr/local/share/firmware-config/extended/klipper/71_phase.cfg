# Bundled phase config 0.1.0 | Updated: 2026-11-19
# SPDX-License-Identifier: GPL-3.0-or-later
# Based on Justin's U1 phase-stepping guide; supplied by the package owner.
# Phase-capable AT32 images only. Registration does not enable phase stepping.
# Both auto_enable values intentionally remain False. Test before enabling.
# Phase calibration uses T0's configured LIS2DW object; confirm the actual chip
# before calibration. SAVE_CONFIG is an explicit operator action afterward.
# Remove a legacy phase.cfg's overlapping sections before adopting this file.

[phase_stepping stepper_x]
auto_enable: False

[phase_stepping stepper_y]
auto_enable: False

[phase_calibrate]
accel_chip: lis2dw e0_lis2dw
speed_min: 30
speed_max: 80

[gcode_macro PHASE_CALIBRATE_XY]
description: Calibrate phase stepping angle corrections for X and Y (T0 accelerometer)
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  T0 A0
  PHASE_STEPPING_ENABLE STEPPER=stepper_x
  PHASE_STEPPING_ENABLE STEPPER=stepper_y
  PHASE_STEPPING_CALIBRATE STEPPER=stepper_x POINT=135,167,10 GRAPH=0
  PHASE_STEPPING_CALIBRATE STEPPER=stepper_y POINT=135,167,10 GRAPH=0
  RESPOND MSG="Phase calibration done. Review the results, then run SAVE_CONFIG to keep the corrections."
