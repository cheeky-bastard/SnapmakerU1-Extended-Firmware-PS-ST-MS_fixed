name: Build four combined firmware variants 2.0

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combined-phase-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'cheeky-bastard/SnapmakerU1-Extended-Firmware-PS-ST-MS_fixed'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: extended
            profile: extended-cheeky_b52
            label: extended-STC-MS
            image: U1_extended-STC-MS_2.0_upgrade.bin
          - id: extended-phase
            profile: extended-cheeky_b52-phase
            label: extended-PhaseStep-STC-MS
            image: U1_extended-PhaseStep-STC-MS_2.0_upgrade.bin
          - id: extended-multiace-phase
            profile: extended-cheeky_b52-multiace-phase
            label: extended-multiACE-PhaseStep-STC-MS
            image: U1_extended-multiACE-PhaseStep-STC-MS_2.0_upgrade.bin
          - id: extended-afc-phase
            profile: extended-cheeky_b52-afc-phase
            label: extended-AFC-PhaseStep-STC-MS
            image: U1_extended-AFC-PhaseStep-STC-MS_2.0_upgrade.bin
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      BUILD_PROFILE: ${{ matrix.profile }}
      DOCKER_OPTS: '-e BUILD_PROFILE'
      CI: '1'
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build firmware development image
        uses: docker/build-push-action@v6
        with:
          context: .github/dev
          load: true
          tags: snapmaker-u1-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load firmware variables and identify personal build
        shell: bash
        run: |
          set -euo pipefail
          cat vars.mk >> "$GITHUB_ENV"
          base_version=$(sed -n 's/^FIRMWARE_VERSION=//p' vars.mk)
          echo "GIT_VERSION=${base_version}-${{ matrix.label }}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Restore original firmware download
        uses: actions/cache@v4
        with:
          path: firmware/${{ env.FIRMWARE_FILE }}
          key: calibration-firmware-${{ env.FIRMWARE_SHA256 }}

      - name: Restore kernel build cache
        uses: actions/cache@v4
        with:
          path: tmp/kernel/
          key: calibration-kernel-${{ runner.os }}-${{ runner.arch }}-${{ env.KERNEL_SHA }}

      - name: Restore pinned phase source and toolchain downloads
        uses: actions/cache@v4
        with:
          path: |
            tmp/cache/u1-phase-8825a2c8b547913e80aed9bce1e9021f9de38594/.git
            tmp/cache/gcc-arm-none-eabi-10.3-2021.10-*.tar.bz2
          key: phase-source-toolchain-${{ runner.os }}-${{ runner.arch }}-8825a2c8-10.3-2021.10

      - name: Verify the combined 2.0 source policy
        run: |
          python3 -B - <<'PY'
          import json,pathlib
          lock = json.loads(pathlib.Path("combined-source-lock.json").read_bytes())
          assert lock["firmware_line"] == "2.0"
          assert __import__("os").environ["BUILD_PROFILE"] in {v["profile"] for v in lock["variants"]}
          assert "FIRMWARE_VERSION=2.0.0\n" in pathlib.Path("vars.mk").read_text()
          assert lock["phase_auto_enabled"] is False
          assert lock["justin_klipper_commit"] == "8825a2c8b547913e80aed9bce1e9021f9de38594"
          print("Combined profile remains on 2.0 with pinned optional phase stepping")
          PY

      - name: Reject Windows line endings in usermod scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in [*Path("overlays/mods/cheeky_b52").rglob("*.sh"), *Path("overlays/mods/phase").rglob("*.sh")]:
              assert b"\r" not in path.read_bytes(), str(path)
          print("Usermod shell scripts use Unix line endings")
          PY

      - name: Build tools
        run: ./dev.sh make tools

      - name: Verify multiACE configuration sanitizer
        if: matrix.id == 'extended-multiace-phase'
        run: sh overlays/mods/multiace/70-app-multiace/test_multiace_config_sanitizer.sh

      - name: Verify AFC normal persistence and collision protection
        if: matrix.id == 'extended-afc-phase'
        run: python3 -B tools/test_afc_persistence.py

      - name: Download and verify original firmware
        run: ./dev.sh make firmware

      - name: Verify original firmware container round trips
        run: ./dev.sh make test

      - name: Build extended firmware with calibration usermod
        run: ./dev.sh make build PROFILE=${{ matrix.profile }} PROFILE_LABEL=${{ matrix.label }} OUTPUT_FILE=firmware/${{ matrix.image }}

      - name: Check out pinned calibration regression sources
        uses: actions/checkout@v4
        with:
          repository: cheeky-bastard/Snapmaker-U1-Single-Tool-Calibration
          ref: a8efd8f02ccc2911a2eb7ca5d3b09b59837d28a8
          path: regression-source

      - name: Test the actual 2.0 calibration payload
        run: |
          python3 -m venv "$RUNNER_TEMP/calibration-tests"
          "$RUNNER_TEMP/calibration-tests/bin/pip" install --disable-pip-version-check jinja2==3.1.6
          "$RUNNER_TEMP/calibration-tests/bin/python" -B - <<'PY'
          import os,pathlib,sys,unittest
          fixture = pathlib.Path("regression-source/tests/native/pr760/modified")
          actual = pathlib.Path("tmp/firmware/rootfs/home/lava/klipper")
          for relative in ("klippy/kinematics/extruder.py", "klippy/extras/extruder_config_bak.py", "klippy/extras/probe_inductance_coil.py"):
              expected = (fixture / relative).read_bytes()
              if "-afc-" in os.environ["BUILD_PROFILE"] and relative.endswith("kinematics/extruder.py"):
                  old = b'            raise ValueError("Invalid extruder name")'
                  new = b'            logging.warning(f"Extruder index not found for {extruder_name}")'
                  assert expected.count(old) == 1
                  expected = expected.replace(old, new)
              assert (actual / relative).read_bytes() == expected, relative
          macro = pathlib.Path("tmp/firmware/rootfs/usr/local/share/firmware-config/extended/klipper/70_tool_offsets.cfg")
          assert macro.read_bytes() == pathlib.Path("regression-source/overlays/mods/tooloffsets/02-macros/root/usr/local/share/firmware-config/extended/klipper/70_tool_offsets.cfg").read_bytes()
          os.environ["U1_CALIBRATION_PROFILE"] = "paxx-2.0-pr760"
          sys.path.insert(0,str(pathlib.Path("regression-source").resolve()))
          suite = unittest.defaultTestLoader.loadTestsFromNames(["tests.native.test_native", "tests.test_macros", "tests.test_profiles"])
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          assert result.wasSuccessful() and result.testsRun == 64
          print("All 64 calibration regressions passed; actual native payload matches with only the permitted AFC warning delta where applicable")
          PY
          "$RUNNER_TEMP/calibration-tests/bin/python" -B tools/test_bundled_phase.py

      - name: Unpack generated firmware
        run: ./dev.sh scripts/helpers/unpack_firmware.sh "$PWD/firmware/${{ matrix.image }}" "$PWD/tmp/calibration-verification"

      - name: Verify six files from the packed image
        shell: bash
        run: |
          ./dev.sh python3 -B -c '
          import hashlib, pathlib, subprocess
          expected = {
              "home/lava/klipper/klippy/kinematics/extruder.py": "da375bfb97d065a1511829ae1f0d3d44531b18c4c39246439812a8989ceb5cae",
              "home/lava/klipper/klippy/extras/extruder_config_bak.py": "21cb0c7037eb0c2ee195704e8e81dfd5fad307ff5cb16a0c3ed981b006d0f302",
              "home/lava/klipper/klippy/extras/probe_inductance_coil.py": "05196461cea7160eb9ffee5907a2332d12d1740349d8e65b1f3d7671fca545c8",
              "home/lava/klipper/klippy/extras/print_task_config.py": "1ef6e8ade716fab99715e00e58502016197f43d3147620018a34c681e9d312eb",
              "home/lava/klipper/klippy/queuefile.py": "fce61a3256e376b566b8676c8b95f9c3082846881995af8cb0369af581938157",
              "usr/local/share/firmware-config/extended/klipper/70_tool_offsets.cfg": "ea4733329ae5575a5b42d26284f8d79178f5153bdb2cbe832907df749625cde0",
          }
          lock = __import__("json").loads(pathlib.Path("combined-source-lock.json").read_bytes())
          if "-afc-" in __import__("os").environ["BUILD_PROFILE"]:
              expected["home/lava/klipper/klippy/kinematics/extruder.py"] = lock["afc_extruder_sha256"]
          original = pathlib.Path("tools/tmp/test")
          packed = pathlib.Path("tmp/calibration-verification")
          for name in ("UPFILE_MAGIC_VER", "UPFILE_EXT", "gd32h757.bin"):
              assert (original / name).read_bytes() == (packed / name).read_bytes(), name
          print("Original header version and extra MCU payload preserved")
          image = "tmp/calibration-verification/rk-unpacked/rootfs.img"
          lines = []
          for name, digest in expected.items():
              content = subprocess.check_output(["unsquashfs", "-cat", image, name])
              assert hashlib.sha256(content).hexdigest() == digest, name
              if name.endswith(".py"):
                  compile(content, name, "exec")
              lines.append(digest + "  " + name)
          pathlib.Path("firmware/payload-sha256.txt").write_text("\n".join(lines) + "\n")
          cleanup = subprocess.check_output(["unsquashfs", "-cat", image, "usr/local/share/firmware-config/force-cleanup.sha256"]).decode()
          assert "5d73c5f489bccd124a6343f8b32968d52f29f8ab353cc45607f0ba556ac42ccd  klipper/70_tool_offsets.cfg" in cleanup.splitlines()
          print("All six packed-image payload checks and stock CFG migration entry passed")
          '

      - name: Verify packed phase MCU and host pairing
        run: ./dev.sh python3 -B tools/verify_combined_phase.py "$BUILD_PROFILE"

      - name: Record firmware checksum and build identity
        shell: bash
        run: |
          ./dev.sh bash -euo pipefail -c '
          cd firmware
          sha256sum ${{ matrix.image }} > ${{ matrix.image }}.sha256
          printf "profile=%s\nsource_commit=%s\nversion=%s\n" "$BUILD_PROFILE" "$(git rev-parse HEAD)" "$GIT_VERSION" > build-info.txt
          cp ../docs/combined_package.md TESTING.md
          cp ../docs/phase_stepping.md PHASE_STEPPING.md
          cp ../docs/single_tool_calibration.md WORK_INSTRUCTIONS.md
          cp ../combined-source-lock.json combined-source-lock.json
          cat ../NOTICE.combined.md ../overlays/mods/cheeky_b52/NOTICE.md > NOTICE.md
          cp ../LICENSE LICENSE
          cp ../overlays/mods/cheeky_b52/02-macros/root/usr/local/share/firmware-config/extended/klipper/70_tool_offsets.cfg 70_tool_offsets.cfg
          if [ -f ../tmp/firmware/rootfs/usr/local/share/firmware-config/extended/klipper/71_phase.cfg ]; then
            cp ../tmp/firmware/rootfs/usr/local/share/firmware-config/extended/klipper/71_phase.cfg 71_phase.cfg
          fi
          '

      - name: Upload firmware and verification records
        uses: actions/upload-artifact@v4
        with:
          name: combined-four-${{ matrix.id }}-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            firmware/${{ matrix.image }}
            firmware/${{ matrix.image }}.sha256
            firmware/payload-sha256.txt
            firmware/build-info.txt
            firmware/TESTING.md
            firmware/NOTICE.md
            firmware/LICENSE
            firmware/70_tool_offsets.cfg
            firmware/71_phase.cfg
            firmware/PHASE_STEPPING.md
            firmware/WORK_INSTRUCTIONS.md
            firmware/combined-source-lock.json
            firmware/phase-build.json
            firmware/phase-payload-sha256.txt

  publish:
    name: Publish all four verified variants
    needs: build
    if: github.repository == 'cheeky-bastard/SnapmakerU1-Extended-Firmware-PS-ST-MS_fixed'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release assembly source
        uses: actions/checkout@v4

      - name: Download the four verified artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: combined-four-*-${{ github.run_number }}-${{ github.run_attempt }}
          path: release-input
          merge-multiple: false

      - name: Verify and assemble all four downloads
        run: python3 -B tools/assemble_variant_release.py release-input release-assets

      - name: Publish personal four-variant prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: cheeky-bastard/SnapmakerU1-Extended-Firmware-PS-ST-MS_fixed
        run: |
          set -euo pipefail
          tag="ST-MS-2.0-four-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          notes_file="$RUNNER_TEMP/four-variant-release.md"
          cat > "$notes_file" <<'NOTES'
          Four experimental builds on stock U1 2.0.0.205. Every build includes independent T1/T2/T3 calibration and the guarded mixed-nozzle print-start fix.

          | File | Contents |
          | --- | --- |
          | U1_extended-STC-MS_2.0_upgrade.bin | Extended + our fixes; no phase stepping |
          | U1_extended-PhaseStep-STC-MS_2.0_upgrade.bin | Extended + our fixes + phase stepping |
          | U1_extended-multiACE-PhaseStep-STC-MS_2.0_upgrade.bin | Extended + our fixes + multiACE + phase stepping |
          | U1_extended-AFC-PhaseStep-STC-MS_2.0_upgrade.bin | Extended + our fixes + AFC + phase stepping |

          Phase variants require an AT32 mainboard and remain off until configured. The non-phase build retains stock MCU binaries; remove existing phase-only configuration before switching to it. AFC and multiACE retain their upstream setup/activation procedures; inclusion does not configure external hardware automatically.

          The three phase variants now bundle extended/klipper/71_phase.cfg with both auto_enable values False and the PHASE_CALIBRATE_XY button. Skip hand-creating phase.cfg or its macro. Existing active phase sections/custom files are preserved; review 71_phase.cfg.default when applicable. Match T0's actual accelerometer before calibration. The non-phase image excludes this config; customized phase files and SAVE_CONFIG entries require explicit review before rollback. The standalone 71_phase.cfg asset cannot add phase support to a non-phase image.

          All four must pass 64 calibration regressions, eight actual nozzle checks, six packed native/config checks and container round trips before this release can publish. Phase variants additionally verify target-image helper loading and packed MCU/host/recovery pairing. The non-phase build verifies unchanged stock MCU payloads and absence of phase host support. The AFC variant permits only the existing one-line extruder-name error-to-warning change outside calibration logic; its exact final hash is separately checked. AFC source is pinned in combined-source-lock.json.

          Justin's unchanged guide is PHASE_STEPPING.md; WORK_INSTRUCTIONS.md covers our macro buttons and Mainsail grouping. Read TESTING.md, verify the chosen image checksum and obtain verified configuration/calibration/native backups before installing. Each variant has its own verification ZIP and release-index entry. Hardware acceptance of these combinations is pending. No debug/factory mode or upstream PR is involved; 2.1 remains separate.
          NOTES
          printf '\nBuild source: `%s`\n' "$GITHUB_SHA" >> "$notes_file"
          gh release create "$tag" release-assets/* --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "Firmware 2.0: four variants + single-tool calibration + mixed nozzles — experimental ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file "$notes_file" --prerelease --latest=false
